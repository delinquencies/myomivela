name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: for f in server.mjs lib/*.mjs lib/routes/*.mjs scripts/*.mjs; do node --check "$f"; done
      - run: npm test
