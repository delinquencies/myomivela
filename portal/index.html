<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faeee3">
  <meta name="robots" content="noindex">
  <title data-i18n="Care Portal | myo.">Care Portal | myo.</title>
  <link rel="stylesheet" href="../assets/home.css?v=shared-shell">
  <link rel="stylesheet" href="../assets/portal.css?v=dux-03">
  <script src="../assets/portal.js?v=dux-03" type="module"></script>
  <script type="module" src="../assets/public-i18n.js"></script>
  <script type="module" src="../assets/home.js"></script>
</head>
<body>
  <a class="skip" href="#main" data-i18n="Skip to content">Skip to content</a>
  <header class="site-header site-header--sticky">
    <a class="wordmark" href="../index.html" aria-label="myo.">myo<span class="wordmark-mark" aria-hidden="true"><svg class="wordmark-shape" viewBox="0 0 24 24"><path fill="currentColor" d="M 12 8 C 14.2 8 16 9.8 16 12 16 14.2 14.2 16 12 16 9.8 16 8 14.2 8 12 8 9.8 9.8 8 12 8 Z"/></svg><span class="wordmark-burst"><span>♥</span><span>♥</span><span>♥</span><span>♥</span></span></span></a>
    <div class="header-actions">
      <div class="language" role="group" aria-label="Language" data-i18n-aria-label="Language">
      <button type="button" data-language="en" lang="en" aria-label="EN, English" aria-pressed="true">EN</button>
      <button type="button" data-language="es" lang="es" aria-label="ES, Español" aria-pressed="false">ES</button>
    </div>
      <details class="site-menu portal-menu">
        <summary class="menu-toggle" aria-label="Portal menu" data-i18n-aria-label="Portal menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path class="menu-bars" d="M4 6h16M4 12h16M4 18h16"/>
            <path class="menu-close" d="m6 6 12 12M18 6 6 18"/>
          </svg>
        </summary>
        <div class="menu-panel">
          <nav class="site-nav" aria-label="Care portal" data-i18n-aria-label="Care portal">
            <div id="portal-links"></div>
            <a id="account-link" href="#account" hidden data-i18n="Account">Account</a>
            <a href="../index.html" data-i18n="Back to website">Back to website</a>
          </nav>
          <button id="logout" type="button" hidden data-i18n="Sign out">Sign out</button>
        </div>
      </details>
    </div>
  </header>
  <main class="section-wrap portal" id="main" tabindex="-1">
    <h1 data-i18n="Care portal.">Care portal.</h1>
    <div class="portal-feedback">
      <p id="feedback" role="status" aria-live="polite" aria-atomic="true"></p>
      <button class="secondary" type="button" id="dismiss-feedback" aria-label="Dismiss notification" data-i18n-aria-label="Dismiss notification" hidden>×</button>
    </div>
    <div id="app" aria-busy="true"><p data-i18n="Loading…">Loading…</p></div>
    <dialog class="booking-confirmation" id="cancel-booking" aria-labelledby="cancel-booking-title">
      <h3 id="cancel-booking-title">Cancel this visit?</h3>
      <p data-cancel-terms role="status"></p>
      <form method="dialog">
        <button type="submit" value="keep" class="secondary" autofocus data-i18n="Keep visit">Keep visit</button>
        <button type="submit" value="confirm"><span class="control-icon" aria-hidden="true">✕</span> <span data-cancel-label>Cancel visit</span></button>
      </form>
    </dialog>
    <noscript data-i18n="Enable JavaScript to use the care portal.">Enable JavaScript to use the care portal.</noscript>
  </main>
</body>
</html>
