<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faeee3">
  <meta name="robots" content="noindex">
  <title>Care Portal | myo.</title>
  <link rel="stylesheet" href="../assets/home.css?v=outfit-2">
  <link rel="stylesheet" href="../assets/portal.css?v=outfit-1">
  <script src="../assets/portal.js" type="module"></script>
</head>
<body>
  <header class="section-wrap preview-header">
    <a class="wordmark" href="../">myo.</a>
    <div class="portal-header-links">
      <a class="tap-link" href="../index.html"><span class="control-icon" aria-hidden="true">🏠</span> Back to website</a>
      <a class="tap-link" id="account-link" href="#account" hidden><span class="control-icon" aria-hidden="true">👤</span> Account</a>
      <button id="logout" type="button" hidden><span class="control-icon" aria-hidden="true">↩️</span> Sign out</button>
    </div>
  </header>
  <main class="section-wrap portal">
    <h1>Care portal.</h1>
    <p id="feedback" role="status" aria-live="polite"></p>
    <div id="app" aria-busy="true"><p>Loading…</p></div>
    <dialog class="booking-confirmation" id="cancel-booking" aria-labelledby="cancel-booking-title">
      <h3 id="cancel-booking-title">Cancel or decline this booking?</h3>
      <form method="dialog">
        <button type="submit" value="keep" class="secondary" autofocus>Keep booking</button>
        <button type="submit" value="confirm"><span class="control-icon" aria-hidden="true">✕</span> Cancel booking</button>
      </form>
    </dialog>
    <noscript>Enable JavaScript to use the care portal.</noscript>
  </main>
</body>
</html>
