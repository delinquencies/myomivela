<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faeee3">
  <title>MYO</title>
  <link rel="stylesheet" href="../../assets/home.css">
  <link rel="stylesheet" href="../../assets/myo-launch.css">
  <script type="module" src="../../assets/myo-launch.js"></script>
</head>
<body class="launch">
  <a class="skip" href="#main" data-copy="skip"></a>
  <header class="site-header">
    <a class="wordmark" href="../../index.html" data-label="home">myo.</a>
    <div class="language" role="group" data-label="languages">
      <button type="button" data-language="en" lang="en" aria-label="EN, English">EN</button>
      <button type="button" data-language="es" lang="es" aria-label="ES, Español">ES</button>
    </div>
  </header>
  <main class="launch-main" id="main">
    <div class="launch-intro">
      <h1 data-copy="heading"></h1>
      <p data-copy="intro"></p>
      <a class="button" href="../../portal/index.html?service=meet#book" data-copy="meetLink"></a>
      <nav class="launch-nav" data-label="title">
        <a href="#rates" data-copy="ratesNav"></a>
        <a href="#peak" data-copy="peakNav"></a>
        <a href="#policies" data-copy="policiesNav"></a>
        <a href="#intake" data-copy="intakeNav"></a>
      </nav>
    </div>
    <section id="rates">
      <h2 data-copy="ratesTitle"></h2>
      <p data-copy="ratesIntro"></p>
      <div id="rate-cards" class="launch-grid"></div>
      <div class="launch-card launch-excluded">
        <h3 data-copy="excludedTitle"></h3>
        <ul id="excluded-services"></ul>
      </div>
      <div class="launch-card launch-estimate">
        <h3 data-copy="estimateTitle"></h3>
        <p id="estimate-hint" data-copy="estimateHint"></p>
        <form id="estimate-form" aria-describedby="estimate-hint" novalidate>
          <div class="launch-fields" id="estimate-fields"></div>
          <button class="button" type="submit" data-copy="estimateButton"></button>
          <div id="estimate-result" role="status"></div>
        </form>
      </div>
    </section>
    <section id="peak">
      <h2 data-copy="peakTitle"></h2>
      <p data-copy="peakIntro"></p>
      <ul class="launch-grid launch-dates" id="peak-dates"></ul>
    </section>
    <section id="policies">
      <h2 data-copy="policiesTitle"></h2>
      <div id="policy-list"></div>
    </section>
    <section id="intake">
      <h2 data-copy="intakeFormTitle"></h2>
      <p id="intake-hint" data-copy="intakeHint"></p>
      <a class="button" href="../../portal/index.html#care" data-copy="portalIntakeLink"></a>
      <form id="intake-form" class="launch-card" aria-describedby="intake-hint" novalidate>
        <div class="launch-fields" id="intake-fields"></div>
        <button class="button" type="submit" data-copy="intakeButton"></button>
        <p id="intake-result" role="status"></p>
      </form>
    </section>
  </main>
</body>
</html>
